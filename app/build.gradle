plugins { id 'com.android.application' }
android {
  namespace 'com.gym.app'
  compileSdk 34
  defaultConfig {
    applicationId "com.gym.app"
    minSdk 26
    targetSdk 34
    versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger())
    versionName "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
  }
  signingConfigs {
    fixed {
      storeFile file("gym.keystore")
      storePassword "gymapp123"
      keyAlias "gym"
      keyPassword "gymapp123"
    }
  }
  buildTypes { release { minifyEnabled false; signingConfig signingConfigs.fixed } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  lint { checkReleaseBuilds false; abortOnError false }
}
